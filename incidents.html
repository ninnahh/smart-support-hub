<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Инциденты — Smart Support Hub</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="incidents">
<div class="app">
<aside id="sidebar" class="sidebar"></aside>
<div class="main">
<header id="topbar" class="topbar"></header>
<main class="content">
<div class="card">
<h2>Новый инцидент</h2>
<form id="incidentForm" class="row" novalidate>
<label>Описание<input id="title" type="text" placeholder="Что случилось?"></label>
<label>Приоритет<select id="priority"><option value="critical">Критический (4 ч)</option><option value="high">Высокий (8 ч)</option><option value="medium" selected>Средний (24 ч)</option><option value="low">Низкий (72 ч)</option></select></label>
<button class="btn" type="submit">Создать</button>
</form>
</div>
<div class="card">
<div class="toolbar">
<h2 style="margin:0">Инциденты</h2>
<label>Статус
<select id="statusFilter"><option value="all">Все</option><option value="new">Новые</option><option value="in_progress">В работе</option><option value="resolved">Решённые</option></select>
</label>
</div>
<div class="table-wrap"><table>
<thead><tr><th>ID</th><th>Описание</th><th>Приоритет</th><th>Статус</th><th>SLA</th><th>Срок до</th><th>Действия</th></tr></thead>
<tbody id="incidentTable"></tbody>
</table></div>
</div>
</main>
</div>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/layout.js"></script>

<script src="assets/js/incidents.js"></script>
</body>
</html>
